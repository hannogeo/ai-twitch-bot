name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: src
      run: npm ci --no-audit --no-fund

    - name: Build with electron-builder
      working-directory: src
      run: npx electron-builder --win dir

    - name: Prepare portable folder
      working-directory: src
      run: |
        Move-Item dist\win-unpacked dist\AITwitchBot
        Copy-Item version.json dist\AITwitchBot\ -Force

    - name: Zip portable build
      working-directory: src
      run: Compress-Archive -Path dist\AITwitchBot -DestinationPath dist\AITwitchBot.zip -Force

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Installer
      run: iscc installer.iss

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AITwitchBot-Setup.exe
          src/dist/AITwitchBot.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
