name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flet flet-desktop groq ddgs requests

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "AITwitchBot" --icon "assets/app_icon.ico" --collect-all flet --collect-all flet_desktop --add-data "version.json;." --add-data "assets/app_icon.ico;assets" --paths src src/main.py
        Copy-Item version.json dist\AITwitchBot\ -Force

    - name: Zip portable build
      run: |
        Compress-Archive -Path dist\AITwitchBot -DestinationPath dist\AITwitchBot.zip

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Installer
      run: |
        iscc installer.iss

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AITwitchBot-Setup.exe
          dist/AITwitchBot.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
